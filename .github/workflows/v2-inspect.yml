name: V2 Inspect

on:
  push:
    branches: [v2-dev]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current runtime source
        run: |
          rm -rf src v2-snapshot
          cat deploy-source/source.b64.* | base64 -d > source.tar.xz
          mkdir src
          tar -xJf source.tar.xz -C src
          patch -d src -p1 < deploy-source/patches/0001-lesson-editor-null-project.patch
          patch -d src -p1 < deploy-source/patches/0002-safe-response-error-body.patch
          patch -d src -p1 < deploy-source/patches/0004-editable-objectives.patch
          patch -d src -p1 < deploy-source/patches/0005a-section-regeneration-backend.patch
          patch -d src -p1 < deploy-source/patches/0005b-section-regeneration-frontend.patch
          cp deploy-source/elearning_v2.py src/app/services/lesson_writer/v2.py
          patch -d src -p1 < deploy-source/patches/0006b-hook-elearning-v2.patch
      - name: Snapshot V2 target files
        run: |
          mkdir -p v2-snapshot/app/services/lesson_writer v2-snapshot/app/schemas v2-snapshot/app/db v2-snapshot/frontend/lib v2-snapshot/frontend/components/editor
          cp -a src/app/services/lesson_writer/. v2-snapshot/app/services/lesson_writer/
          cp -a src/app/schemas/generation.py v2-snapshot/app/schemas/ || true
          cp -a src/app/db/models.py v2-snapshot/app/db/ || true
          cp -a src/frontend/lib/api.ts v2-snapshot/frontend/lib/
          cp -a src/frontend/lib/types.ts v2-snapshot/frontend/lib/ || true
          cp -a src/frontend/components/editor/Inspector.tsx v2-snapshot/frontend/components/editor/
          cp -a src/frontend/components/editor/LessonEditor.tsx v2-snapshot/frontend/components/editor/
          echo '=== app structure ==='
          find src/app -maxdepth 2 -type f | sort | head -120
          echo '=== snapshot ==='
          find v2-snapshot -type f -maxdepth 8 -print | sort
      - name: Python syntax check
        working-directory: src
        run: python -m compileall -q app
      - name: Docker build API V2
        run: docker build -f Dockerfile.api -t ai-elearning-api:v2 .
      - name: Docker build frontend V2
        run: docker build -f Dockerfile.frontend -t ai-elearning-frontend:v2 .
      - name: Commit snapshot
        if: success()
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2-snapshot
          if ! git diff --cached --quiet; then
            git commit -m 'chore: snapshot runtime source for v2 development'
            git push origin HEAD:v2-dev
          fi
