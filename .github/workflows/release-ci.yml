name: Release CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: elearning
          POSTGRES_USER: elearning
          POSTGRES_PASSWORD: elearning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elearning -d elearning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://elearning:elearning@localhost:5432/elearning
      APP_ENV: test
      JWT_SECRET_KEY: ci-secret-ci-secret-ci-secret-ci-secret
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_ENABLED: "false"
      NEXT_PUBLIC_API_URL: https://api-production-f81b.up.railway.app
      PGPASSWORD: elearning
    steps:
      - uses: actions/checkout@v4
      - name: Check UI patch syntax
        run: node --check deploy-source/ui_v2_patch.mjs
      - name: Reconstruct and verify source
        run: |
          cat deploy-source/source.b64.* | base64 -d > source.tar.xz
          echo "6d12efd05141a0f954ac1be2bcb644dcaee9771d0973757fde99d9ca0f80461a  source.tar.xz" | sha256sum -c -
          mkdir src
          tar -xJf source.tar.xz -C src
          patch -d src -p1 < deploy-source/patches/0001-lesson-editor-null-project.patch
          python deploy-source/content_grounding_patch.py src
      - name: Inspect interaction persistence API
        working-directory: src
        run: |
          echo "INTERACTION_ROUTES_BEGIN"
          sed -n '1,300p' app/api/routes/interactions.py
          echo "INTERACTION_ROUTES_END"
          echo "SLIDE_SCHEMA_BEGIN"
          grep -RIn -A80 -B20 'class Slide' app/schemas app/api | head -n 300 || true
          echo "SLIDE_SCHEMA_END"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: src
        run: pip install -r requirements.txt
      - name: Source grounding regression
        working-directory: src
        run: PYTHONPATH=. python ../deploy-source/test_content_grounding.py
      - name: Enable pgvector extension
        run: psql -h localhost -U elearning -d elearning -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Migrate database
        working-directory: src
        run: alembic upgrade head
      - name: Backend import and syntax smoke
        working-directory: src
        run: |
          python -m compileall -q app alembic
          python -c 'import app.main; print("backend-import-ok")'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm install
      - name: Upgrade Next.js security patch
        working-directory: src/frontend
        run: npm install next@16.3.6 --save-exact
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
      - name: Docker build API
        run: docker build -f Dockerfile.api -t ai-elearning-api:ci .
      - name: V2 interaction regression smoke
        run: docker run --rm --entrypoint python ai-elearning-api:ci -c "from types import SimpleNamespace as S; from app.services.lesson_writer.v2 import enrich_section_v2; mk=lambda k,t:S(section_key=k,slides=[S(title=\"Smoke\",onscreen_text=[t,\"Thông tin bổ sung từ học liệu giúp người học hiểu rõ nội dung trọng tâm của bài học\"],source_refs=[],interaction=None,teacher_script=\"\",student_instruction=\"\",guiding_question=\"\",metadata={})],warnings=[]); r2=enrich_section_v2(mk(\"interaction_2\",\"Kiến thức quan trọng giúp học sinh ghi nhớ nội dung\"),plan_section={\"section_key\":\"interaction_2\",\"source_chunk_ids\":[]},chunks_by_id={},project=S()); r3=enrich_section_v2(mk(\"interaction_3\",\"Nội dung trọng tâm thứ nhất được dùng để giải thích rõ vấn đề đang học\"),plan_section={\"section_key\":\"interaction_3\",\"source_chunk_ids\":[]},chunks_by_id={},project=S()); rp=enrich_section_v2(mk(\"practice\",\"Kiến thức luyện tập được vận dụng để giải quyết nhiệm vụ cụ thể trong bài học\"),plan_section={\"section_key\":\"practice\",\"source_chunk_ids\":[]},chunks_by_id={},project=S()); assert r2.slides[0].interaction.interaction_type in {\"fill_blank\",\"true_false\"}; assert r3.slides[0].interaction.interaction_type==\"single_choice\"; assert rp.slides[0].interaction.interaction_type==\"matching\"; assert isinstance(rp.slides[0].interaction.correct_answer,dict) and len(rp.slides[0].interaction.correct_answer)>=2; print(\"v2-interaction-regression-smoke-ok\")"
      - name: Docker build frontend
        run: docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -f Dockerfile.frontend -t ai-elearning-frontend:ci .
      - name: Ensure ffprobe for MP4 smoke
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Runtime smoke API container
        run: |
          docker run -d --name api-smoke --network host \
            -e PORT=8000 \
            -e APP_ENV=test \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e RATE_LIMIT_ENABLED=false \
            ai-elearning-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8000/ready
          bash deploy-source/test_e2e_lesson_pipeline.sh
          bash deploy-source/test_pptx_upload_pipeline.sh
          bash deploy-source/test_large_pptx_upload.sh
          python deploy-source/test_project_access.py
          python deploy-source/test_teacher_tool_access.py
      - name: Runtime smoke frontend container
        run: |
          docker run -d --name frontend-smoke --network host --add-host api.railway.internal:127.0.0.1 -e PORT=3000 ai-elearning-frontend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login >/tmp/login.html; then break; fi
            sleep 2
          done
          test -s /tmp/login.html
          grep -q "AI E-Learning" /tmp/login.html
          curl -fsS http://127.0.0.1:3000/library >/tmp/library.html
          curl -fsS http://127.0.0.1:3000/students >/tmp/students.html
          curl -fsS http://127.0.0.1:3000/reports >/tmp/reports.html
          test -s /tmp/library.html
          test -s /tmp/students.html
          test -s /tmp/reports.html
          API="http://127.0.0.1:3000/api/v1" TEST_VARIANT=proxy bash deploy-source/test_large_pptx_upload.sh
      - name: Runtime logs on failure
        if: failure()
        run: |
          docker logs api-smoke 2>&1 || true
          docker logs frontend-smoke 2>&1 || true
